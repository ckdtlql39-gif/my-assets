<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>내 자산</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--sub:#5b6472;--line:#e3e6eb;--acc:#1f6feb;--up:#d1242f;--down:#1f6feb;
 --c1:#1f6feb;--c2:#e8730c;--c3:#1a7f37;--c4:#8250df;--c5:#bf3989;--c6:#6e7781;--c7:#0e8a9b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--sub:#9aa3b2;--line:#262b35;--acc:#4c8dff;--up:#ff6b6b;--down:#5aa2ff}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Pretendard,sans-serif}
body{padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}.small{font-size:12px;color:var(--sub)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.total{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:4px 0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 10px;background:var(--line)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px}.dot{width:10px;height:10px;border-radius:3px;flex:none}
.lg .v{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}th{color:var(--sub);font-weight:500;font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--sub);margin-left:4px}
.bots{display:grid;gap:8px}.bot{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.on{color:#1a7f37}.off{color:var(--up)}
#lock{max-width:360px;margin:18vh auto 0;text-align:center}
#lock input{width:100%;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0 8px}
#lock button{width:100%;padding:12px;background:var(--acc);color:#fff;border:0;font-size:16px}
.hide .amt{filter:blur(7px)}
svg{display:block;width:100%;height:auto}
.tabs{display:flex;gap:6px;margin:0 0 12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2;overflow-x:auto}
.tab{flex:1;white-space:nowrap;padding:9px 10px;border-radius:12px}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grp summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}
.grp summary::-webkit-details-marker{display:none}.gt{font-weight:600}.gv{text-align:right}
.grp summary::after{content:"▾";color:var(--sub);margin-left:6px;transition:transform .2s}.grp[open] summary::after{transform:rotate(180deg)}
.rules{margin:0;padding-left:18px;line-height:1.6}.rules li{margin:2px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin-bottom:12px}.legend.one{grid-template-columns:1fr}
@media (max-width:560px){.grid2{grid-template-columns:1fr;gap:0}}
@media (max-width:560px){.hide-sm{display:none}.total{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
 <div id="lock">
  <div style="font-size:40px">🔒</div><h1>내 자산</h1>
  <div class="small">비밀번호를 넣어야 내용이 보여요</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock()">
  <label class="small"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label><br><br>
  <button onclick="unlock()">열기</button>
  <div id="err" class="small" style="color:var(--up);margin-top:10px"></div>
 </div>
 <div id="app" hidden></div>
</div>

const COLORS=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)"];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const raw=b64(BLOB),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));}
function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function unlock(saved){const pw=saved||document.getElementById("pw").value;
 try{const d=await decrypt(pw);if(!saved&&document.getElementById("remember").checked)store("pw",pw);render(d)}
 catch(e){if(saved){store("pw",null);return}document.getElementById("err").textContent="비밀번호가 맞지 않아요"}}
const won=v=>Math.round(v).toLocaleString("ko-KR")+"원";
const man=v=>{const a=Math.abs(v);return (v<0?"-":"")+(a>=1e8?(a/1e8).toFixed(2)+"억":a>=1e4?Math.round(a/1e4).toLocaleString("ko-KR")+"만":Math.round(a))+"원"};
const pct=v=>(v>0?"+":"")+(v*100).toFixed(1)+"%";
function spark(h){if(!h||h.length<2)return'<div class="small">기록이 쌓이면 추이가 보여요</div>';
 const W=600,H=90,v=h.map(x=>x.total),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
 const p=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-6-(y-mn)/r*(H-12)).toFixed(1)}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="총자산 추이"><polyline points="${p}" fill="none" stroke="var(--acc)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
 <div class="small" style="display:flex;justify-content:space-between"><span>${h[0].t.slice(5,16).replace("T"," ")}</span><span class="amt">최저 ${man(mn)} · 최고 ${man(mx)}</span><span>${h[h.length-1].t.slice(5,16).replace("T"," ")}</span></div>`}
const ORDER=["코인","주식","ETF","펀드","금","현금","청약","연금"];
const ICON={코인:"🪙",주식:"📈",ETF:"🧺",펀드:"💼",금:"🥇",현금:"💵",청약:"🏠",연금:"🧓"};
let D=null;
function sortKinds(list){return list.slice().sort((a,b)=>{const ia=ORDER.indexOf(a[0]),ib=ORDER.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib)||b[1]-a[1]})}
function colorOf(k){const i=ORDER.indexOf(k);return COLORS[(i<0?6:i)%7]}
function plSpan(v,p){return v==null?'<span class="muted">-</span>':`<span class="${v>=0?"up":"down"}">${p!=null?pct(p):""}</span>`}
function sumPl(rows){const c=rows.filter(r=>r.cost);const cost=c.reduce((s,r)=>s+r.cost,0),pnl=c.reduce((s,r)=>s+r.pnl,0);return {cost,pnl}}
function table(rows,showAcct,showKind){return `<table><thead><tr><th>종목</th><th>평가액</th><th class="hide-sm">손익</th><th>수익률</th><th class="hide-sm">비중</th></tr></thead><tbody>${
 rows.map(r=>`<tr><td>${r.name}${showKind?`<span class="tag">${r.kind}</span>`:""}${showAcct||r.note?`<div class="small">${showAcct?r.account:""}${r.note?(showAcct?" · ":"")+r.note:""}</div>`:""}</td>
 <td class="amt">${won(r.value)}</td><td class="hide-sm amt ${r.pnl>=0?"up":"down"}">${r.pnl!=null?man(r.pnl):""}</td><td>${plSpan(r.pnl,r.pnl_pct)}</td><td class="hide-sm muted">${(r.weight*100).toFixed(1)}%</td></tr>`).join("")}</tbody></table>`}
function groupCard(title,icon,rows,total,showAcct,showKind,open){const v=rows.reduce((s,r)=>s+r.value,0),{cost,pnl}=sumPl(rows);
 return `<details class="card grp" ${open?"open":""}><summary><span class="gt">${icon||""} ${title}</span><span class="gv"><b class="amt">${man(v)}</b><span class="small"> ${(v/total*100).toFixed(1)}%${cost?` · <span class="${pnl>=0?"up":"down"}">${pct(pnl/cost)}</span>`:""}</span></span></summary>
 <div style="margin-top:8px">${table(rows.sort((a,b)=>b.value-a.value),showAcct,showKind)}</div></details>`}
function render(d){D=d;document.getElementById("lock").hidden=true;const app=document.getElementById("app");app.hidden=false;draw()}
function draw(){const d=D,app=document.getElementById("app");const hidden=load("hide")==="1";document.body.classList.toggle("hide",hidden);
 const tab=load("tab")||"home";const kinds=sortKinds(d.classes);
 const seg=kinds.map(([k,v])=>`<div style="width:${(v/d.total*100).toFixed(2)}%;background:${colorOf(k)}" title="${k}"></div>`).join("");
 const leg=kinds.map(([k,v])=>`<div class="lg"><span class="dot" style="background:${colorOf(k)}"></span>${ICON[k]||""} ${k}<span class="v"><span class="amt">${man(v)}</span> · ${(v/d.total*100).toFixed(1)}%</span></div>`).join("");
 const {cost,pnl}=sumPl(d.rows);
 const tabs=[["home","한눈에"],["kind","종류별"],["acct","계좌별"],["bot","봇"],["way","매매 방식"]].map(([k,t])=>`<button class="tab ${tab===k?"on":""}" onclick="setTab('${k}')">${t}</button>`).join("");
 let body="";
 if(tab==="home"){
  const accts=d.accounts.map(([a,v])=>`<div class="lg">${a}<span class="v"><span class="amt">${man(v)}</span> · ${(v/d.total*100).toFixed(1)}%</span></div>`).join("");
  const top=d.rows.filter(r=>r.kind!=="현금").slice(0,8);
  const movers=d.rows.filter(r=>r.pnl!=null&&r.value>10000).sort((a,b)=>b.pnl_pct-a.pnl_pct);
  const best=movers.slice(0,3),worst=movers.slice(-3).reverse();
  const mv=l=>l.map(r=>`<div class="lg">${r.name}<span class="v">${plSpan(r.pnl,r.pnl_pct)}</span></div>`).join("");
  body=`<div class="card"><div class="small">총자산</div><div class="total amt">${won(d.total)}</div>
   ${cost?`<div class="small">평단 있는 종목 평가손익 <span class="amt ${pnl>=0?"up":"down"}">${man(pnl)} (${pct(pnl/cost)})</span></div>`:""}
   <div style="margin-top:12px">${spark(d.history)}</div></div>
  <div class="card"><h2>자산 종류별</h2><div class="bar">${seg}</div><div class="legend">${leg}</div></div>
  <div class="grid2"><div class="card"><h2>계좌별</h2><div class="legend one">${accts}</div></div>
   <div class="card"><h2>수익률 상위·하위</h2><div class="small" style="margin-bottom:4px">▲ 상위</div><div class="legend one">${mv(best)}</div><div class="small" style="margin:8px 0 4px">▼ 하위</div><div class="legend one">${mv(worst)}</div></div></div>
  <div class="card"><h2>큰 종목 TOP 8</h2>${table(top,true,true)}</div>`;
 } else if(tab==="kind"){
  body=kinds.map(([k],i)=>groupCard(k,ICON[k],d.rows.filter(r=>r.kind===k),d.total,true,false,i<2)).join("");
 } else if(tab==="acct"){
  body=d.accounts.map(([a],i)=>groupCard(a,"🏦",d.rows.filter(r=>r.account===a),d.total,false,true,i<1)).join("");
 } else if(tab==="way"){
  const SC={실거래:"on",알림:"on",후보:"",보류:"off",종료:"off"};
  body=(d.strategies||[]).map((w,i)=>`<details class="card grp" ${w.status==="실거래"||w.status==="알림"?"open":""}><summary><span class="gt">${w.name}</span><span class="gv small ${SC[w.status]||""}">● ${w.status}${w.account?" · "+w.account:""}</span></summary>
   <div style="margin-top:8px"><ul class="rules">${w.rules.map(r=>`<li>${r}</li>`).join("")}</ul>${w.basis?`<div class="small">근거: ${w.basis}</div>`:""}
   ${w.changes.length?`<div class="small" style="margin:10px 0 4px">변동 기록</div><table><tbody>${w.changes.map(c=>`<tr><td class="muted" style="white-space:nowrap">${c[0]}</td><td>${c[1]}</td></tr>`).join("")}</tbody></table>`:""}</div></details>`).join("")||'<div class="card small">정리된 매매 방식 없음</div>';
 } else {
  body=`<div class="card"><h2>자동매매 봇</h2><div class="bots">${(d.bots||[]).map(b=>`<div class="bot"><div><b>${b.name}</b><div class="small">${b.desc}</div></div><div class="small ${b.status==="가동"?"on":"off"}" style="white-space:nowrap">● ${b.status}${b.last?"<br>"+b.last:""}</div></div>`).join("")||'<div class="small">봇 정보 없음</div>'}</div></div>
  ${[["업비트","업비트 현물 봇"],["Gate 선물","Gate 선물 봇"]].map(([acct,label])=>{const rs=d.rows.filter(r=>r.account===acct);if(!rs.length)return "";
    const v=rs.reduce((x,r)=>x+r.value,0);const ks=sortKinds([...new Set(rs.map(r=>r.kind))].map(k=>[k,rs.filter(r=>r.kind===k).reduce((x,r)=>x+r.value,0)]));
    return `<div class="card"><h2>🤖 ${label} <span class="small amt">${man(v)}</span></h2><div class="bar">${ks.map(([k,kv])=>`<div style="width:${(kv/v*100).toFixed(2)}%;background:${colorOf(k)}" title="${k}"></div>`).join("")}</div>
     <div class="legend">${ks.map(([k,kv])=>`<div class="lg"><span class="dot" style="background:${colorOf(k)}"></span>${ICON[k]||""} ${k}<span class="v"><span class="amt">${man(kv)}</span> · ${(kv/v*100).toFixed(1)}%</span></div>`).join("")}</div></div>
     ${ks.map(([k])=>groupCard(`${label} · ${k}`,ICON[k],rs.filter(r=>r.kind===k),d.total,false,false,false)).join("")}`}).join("")}`;
 }
 app.innerHTML=`<header><div><h1>내 자산</h1><div class="small">${d.updated} 기준 · 10분마다 갱신 · $1=${Math.round(d.usd_krw).toLocaleString()}원</div></div>
  <div style="display:flex;gap:6px"><button onclick="toggleHide()">${hidden?"금액 보기":"숨기기"}</button><button onclick="lockNow()">잠그기</button></div></header>
  <nav class="tabs">${tabs}</nav>${body}
  ${d.errors&&d.errors.length?`<div class="card small" style="color:var(--up)">불러오기 오류: ${d.errors.join(" / ")}</div>`:""}
  <div class="small" style="text-align:center">내용은 비밀번호로 암호화되어 있어요 · 주소를 알아도 비밀번호 없이는 보이지 않아요</div>`}
function setTab(k){store("tab",k);draw();window.scrollTo(0,0)}
function toggleHide(){store("hide",load("hide")==="1"?"0":"1");draw()}
function lockNow(){store("pw",null);location.reload()}
const saved=load("pw");if(saved)unlock(saved);
</script>
</body>
</html>
